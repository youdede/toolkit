name: validate

on:
  pull_request:
    types: [opened, synchronize, reopened, edited, ready_for_review]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  policy:
    name: policy
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 20
          package-manager-cache: false
      - name: Validate pull request policy
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          HEAD_BRANCH: ${{ github.head_ref }}
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          node scripts/validate-change-policy.mjs --message "$PR_TITLE" --label pull-request-title
          node scripts/validate-change-policy.mjs --branch "$HEAD_BRANCH" --label pull-request-branch
          node scripts/validate-change-policy.mjs --range "$BASE_SHA..$HEAD_SHA" --label pull-request-commit
      - name: Validate pushed commits
        if: github.event_name == 'push'
        env:
          BEFORE_SHA: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: node scripts/validate-change-policy.mjs --range "$BEFORE_SHA..$HEAD_SHA" --label pushed-commit
      - name: Validate manual-run history
        if: github.event_name == 'workflow_dispatch'
        env:
          HEAD_SHA: ${{ github.sha }}
        run: node scripts/validate-change-policy.mjs --range "$HEAD_SHA" --label repository-commit

  verify:
    name: verify / ${{ matrix.os }} / Node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            node: 20
          - os: ubuntu-latest
            node: 22
          - os: ubuntu-latest
            node: 24
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run check

  quality-gate:
    name: quality-gate
    if: ${{ always() }}
    needs: [policy, verify]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Require every policy and verification job
        env:
          POLICY_RESULT: ${{ needs.policy.result }}
          VERIFY_RESULT: ${{ needs.verify.result }}
        run: |
          test "$POLICY_RESULT" = success
          test "$VERIFY_RESULT" = success
