name: release

# Manually publishes @youdede/toolkit using npm trusted publishing. A signed tag alone cannot
# start this workflow. The operator must dispatch it and type the exact package-and-tag
# confirmation. No long-lived npm token is stored or passed to the job.
#
# Before the first run the accountable publisher must complete the steps in
# docs/release-readiness.md under "Blocking publisher decisions". This workflow deliberately
# refuses to run until the release-readiness gate passes.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing signed tag to publish, for example v0.1.0
        required: true
        type: string
      confirmation:
        description: Type "publish @youdede/toolkit <tag>", using the exact tag above
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  verify:
    name: verify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      sha: ${{ steps.tag-commit.outputs.sha }}
    steps:
      - name: Require explicit public-publish confirmation
        env:
          CONFIRMATION: ${{ inputs.confirmation }}
          TAG: ${{ inputs.tag }}
        run: |
          [[ "$TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]
          test "$CONFIRMATION" = "publish @youdede/toolkit $TAG"

      # npm provenance is unavailable for a private source repository. Fail before checking out
      # or executing repository code rather than silently publishing an unattested package.
      - name: Require a public source repository for provenance
        env:
          REPOSITORY_PRIVATE: ${{ github.event.repository.private }}
        run: test "$REPOSITORY_PRIVATE" = false

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag }}
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      - name: Require a signed, annotated tag
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          TAG: ${{ inputs.tag }}
        run: |
          git merge-base --is-ancestor "$TAG^{commit}" "origin/$DEFAULT_BRANCH"
          git show "origin/$DEFAULT_BRANCH:.github/allowed-signers" > "$RUNNER_TEMP/release-allowed-signers"
          test -s "$RUNNER_TEMP/release-allowed-signers"
          git config gpg.ssh.allowedSignersFile "$RUNNER_TEMP/release-allowed-signers"
          git verify-tag "$TAG"
          test "$(git cat-file -t "$TAG")" = tag

      - name: Record the verified tag commit
        id: tag-commit
        env:
          TAG: ${{ inputs.tag }}
        run: echo "sha=$(git rev-parse "$TAG^{commit}")" >> "$GITHUB_OUTPUT"

      - name: Require the tag to match the package version
        env:
          TAG: ${{ inputs.tag }}
        run: |
          PACKAGE_VERSION="v$(node -p "require('./package.json').version")"
          test "$TAG" = "$PACKAGE_VERSION"

      - run: npm ci --ignore-scripts

      - name: Scan the complete reachable history for high-confidence secrets
        run: npm run check:secrets:history

      - name: Require the tag version to be documented
        env:
          TAG: ${{ inputs.tag }}
        run: |
          grep -qE "^## v?${TAG#v}( |$)" CHANGELOG.md

      - name: Structural and behavioural gate
        run: npm run check

      # npm run check runs most hook verdict cases in process; a release runs every case as a hook process.
      - name: Every hook verdict as a hook process
        run: npm run check:hook-verdicts

      - name: Release-readiness gate
        run: npm run check:readiness

      - name: Record the integrity root digest for the release page
        run: |
          node ./bin/youdede-toolkit.mjs verify-integrity --json > integrity-attestation.json
          node -p "'root digest ' + require('./catalog/integrity.json').rootDigest"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: integrity-attestation
          path: integrity-attestation.json
          retention-days: 90

  publish:
    name: publish
    needs: [verify]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # The environment records deployments. Required reviewers are not available while this is a
    # private user-owned repository on GitHub Pro, so the dispatch confirmation above is mandatory.
    environment: npm-publish
    permissions:
      contents: read
      id-token: write # required for npm trusted publishing (OIDC)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.verify.outputs.sha }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      - name: Require the npm trusted-publishing runtime
        run: |
          NPM_VERSION="$(npm --version)"
          node -e 'const [major, minor, patch] = process.argv[1].split(".").map(Number); if (![major, minor, patch].every(Number.isInteger) || major < 11 || (major === 11 && (minor < 5 || (minor === 5 && patch < 1)))) process.exit(1)' "$NPM_VERSION"

      - run: npm ci --ignore-scripts

      # npm >= 11.5.1 performs the OIDC exchange automatically when id-token: write is present
      # and the package is configured for trusted publishing on npmjs.com.
      - name: Publish with provenance
        run: npm publish --access public --provenance
        env:
          NPM_CONFIG_REGISTRY: https://registry.npmjs.org

      - name: Print the digest to publish on the authenticated release page
        run: |
          node -p "'root digest ' + require('./catalog/integrity.json').rootDigest"
